[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schematic-component-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "numpy>=1.24"]

[project.optional-dependencies]
identity = ["scipy>=1.10"]
vision = ["ultralytics>=8.4", "torch>=2.6", "torchvision>=0.21"]
api = ["openai>=1.60", "requests>=2.31"]
ocr = ["paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4"]
local-ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.20,<2", "opencv-python>=4.8"]

[project.scripts]
component-lab = "component_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
component_lab = ["review_web/*.html", "review_web/*.js", "review_web/*.css", "eval/*.json"]
